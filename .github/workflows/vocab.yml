name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: vocabulary-validation
            name: Vocabulary validation
          - id: lint
            name: Lint
          - id: unit-coverage
            name: Unit tests and coverage
          - id: e2e
            name: E2E
          - id: package-vulnerability
            name: Package vulnerability
          - id: formatting
            name: Formatting
    env:
      DATABASE_URL: file:./data/ci-vocab.db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate vocabulary
        if: matrix.id == 'vocabulary-validation'
        run: npm run validate-vocab
      - name: Lint
        if: matrix.id == 'lint'
        run: npm run lint
      - name: Unit tests and coverage
        if: matrix.id == 'unit-coverage'
        run: npm test
      - name: Typecheck
        if: matrix.id == 'unit-coverage'
        run: npm run typecheck
      - name: Build application
        if: matrix.id == 'e2e'
        run: npm run build
      - name: Install Playwright browser
        if: matrix.id == 'e2e'
        run: npx playwright install --with-deps chromium
      - name: Seed vocabulary
        if: matrix.id == 'e2e'
        run: npm run seed-vocab
      - name: Run E2E tests
        if: matrix.id == 'e2e'
        run: npm run test:e2e
      - name: Package vulnerability audit
        if: matrix.id == 'package-vulnerability'
        run: npm run audit
      - name: Check formatting
        if: matrix.id == 'formatting'
        run: npm run format:check
